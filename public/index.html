<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cursor Remote Bridge</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --panel: #181b1f;
      --line: #30353c;
      --text: #e7e9ec;
      --muted: #a4abb5;
      --accent: #f0b429;
      --ok: #47c982;
      --bad: #ef6f6c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.55 "DM Sans", "Microsoft YaHei", sans-serif;
    }
    main { width: min(1180px, calc(100% - 32px)); margin: 36px auto 64px; }
    h1 { margin: 0; font-size: 30px; letter-spacing: -0.03em; }
    .sub { margin: 6px 0 24px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: 390px minmax(0, 1fr); gap: 18px; }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
    }
    label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 13px; }
    input, textarea, select, button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111418;
      color: var(--text);
      padding: 10px 12px;
      font: inherit;
    }
    textarea { min-height: 190px; resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: 2px solid #5b4b18; outline-offset: 1px; }
    .row { margin-bottom: 14px; }
    .split { display: grid; grid-template-columns: 1fr 100px; gap: 10px; }
    button { cursor: pointer; background: var(--accent); color: #191400; font-weight: 700; }
    button:disabled { opacity: 0.5; cursor: wait; }
    .secondary { background: transparent; color: var(--text); font-weight: 500; }
    .token-actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .token-actions button { width: auto; white-space: nowrap; }
    .help { margin: -2px 0 10px; color: var(--muted); font-size: 12px; }
    .error { display: none; margin: 10px 0; padding: 9px 11px; border: 1px solid #6e3333; border-radius: 8px; background: #2b1718; color: #ffb4b1; font-size: 13px; }
    .error.visible { display: block; }
    [hidden] { display: none !important; }
    .meta { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .status { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .pill { padding: 4px 9px; border-radius: 999px; background: #292e35; font-size: 12px; }
    pre {
      margin: 0;
      min-height: 430px;
      max-height: 62vh;
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #0c0e10;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      font: 13px/1.5 "IBM Plex Mono", Consolas, monospace;
    }
    .artifact { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .artifact a {
      color: var(--accent);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 9px;
      text-decoration: none;
      font-size: 12px;
    }
    @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>Cursor Remote Bridge</h1>
    <p class="sub">本地任务执行入口。令牌仅保存在当前浏览器会话。</p>
    <div class="grid">
      <section>
        <div class="row">
          <label for="token">API Token</label>
          <div class="token-actions">
            <input id="token" type="password" autocomplete="off" placeholder="粘贴完整 Token">
            <button id="load-token" class="secondary" type="button">已载入</button>
          </div>
          <p class="help">点击按钮后自动读取本机配置，无需复制粘贴。仅在本机页面显示。</p>
        </div>
        <div class="row">
          <label for="workspace">Workspace</label>
          <select id="workspace"><option>D:\projects\example</option></select>
        </div>
        <div id="thread-row" class="row" hidden>
          <label for="thread">Cursor Thread UUID（Desktop 模式可选）</label>
          <input id="thread" autocomplete="off" placeholder="从 cursor desktop ls 获取">
        </div>
        <div class="row split">
          <div>
            <label for="timeout">超时（秒）</label>
            <input id="timeout" type="number" min="5" value="1800">
          </div>
          <div>
            <label>&nbsp;</label>
            <button id="submit" type="button">提交</button>
          </div>
        </div>
        <div class="row">
          <label for="prompt">任务指令</label>
          <textarea id="prompt" placeholder="描述要 Cursor 完成的代码任务。"></textarea>
        </div>
        <div id="form-error" class="error" role="alert" aria-live="assertive"></div>
        <button id="cancel" class="secondary" type="button" disabled>取消当前任务</button>
        <p id="meta" class="meta"></p>
      </section>
      <section>
        <div class="status">
          <strong>Execution output</strong>
          <span id="status" class="pill" aria-live="polite">未开始</span>
        </div>
        <pre id="output"></pre>
        <div id="artifacts" class="artifact"></div>
      </section>
    </div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
